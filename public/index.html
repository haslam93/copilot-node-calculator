<html lang="en">
  <head>
    <title>Scientific Calculator</title>
    <link rel="stylesheet" href="default.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
    <meta name="description" content="A modern, accessible scientific calculator application">
    <script src="client.js"></script>
  </head>
  <body onLoad="setValue(0)">
    <div class="container">
      <main class="calculator" role="application" aria-label="Scientific Calculator">
        <div class="calculator-header">
          <h1 class="calculator-title">Scientific Calculator</h1>
          <button class="theme-toggle" onClick="toggleTheme()" aria-label="Toggle dark/light mode">
            <span class="theme-icon">🌙</span>
          </button>
        </div>
        
        <div id="results">
          <div id="result" role="textbox" aria-label="Calculator display" aria-live="polite" aria-readonly="true" tabindex="0"><span class="digit0">0</span></div>
        </div>

        <div id="loading" style="visibility:hidden" aria-hidden="true"></div>

        <div class="calculator-buttons scientific" role="grid" aria-label="Calculator buttons">
          <!-- Scientific functions row 1 -->
          <button class="btn btn-scientific" onClick="scientificPressed('sin')" aria-label="Sine">sin</button>
          <button class="btn btn-scientific" onClick="scientificPressed('cos')" aria-label="Cosine">cos</button>
          <button class="btn btn-scientific" onClick="scientificPressed('tan')" aria-label="Tangent">tan</button>
          <button class="btn btn-scientific" onClick="scientificPressed('log')" aria-label="Logarithm base 10">log</button>
          <button class="btn btn-scientific" onClick="scientificPressed('ln')" aria-label="Natural logarithm">ln</button>

          <!-- Scientific functions row 2 -->
          <button class="btn btn-scientific" onClick="scientificPressed('sqrt')" aria-label="Square root">√</button>
          <button class="btn btn-scientific" onClick="scientificPressed('square')" aria-label="Square">x²</button>
          <button class="btn btn-scientific" onClick="scientificPressed('pow')" aria-label="Power">x^y</button>
          <button class="btn btn-scientific" onClick="scientificPressed('exp')" aria-label="Exponential">eˣ</button>
          <button class="btn btn-scientific" onClick="constantPressed('pi')" aria-label="Pi">π</button>

          <!-- Scientific functions row 3 -->
          <button class="btn btn-scientific" onClick="constantPressed('e')" aria-label="Euler's number">e</button>
          <button class="btn btn-scientific" onClick="scientificPressed('abs')" aria-label="Absolute value">|x|</button>
          <button class="btn btn-scientific" onClick="scientificPressed('inverse')" aria-label="Reciprocal">1/x</button>
          <button class="btn btn-scientific" onClick="scientificPressed('percent')" aria-label="Percent">%</button>
          <button class="btn btn-scientific" onClick="signPressed()" aria-label="Plus/Minus">±</button>

          <!-- Clear buttons -->
          <button class="btn" onClick="clearPressed()" aria-label="Clear all">C</button>
          <button class="btn" onClick="clearPressed()" aria-label="Clear entry">CE</button>
          <button class="btn" onClick="backspacePressed()" aria-label="Backspace">⌫</button>
          <button class="btn" onClick="operationPressed('/')" aria-label="Divide">&divide;</button>
          <button class="btn" onClick="operationPressed('*')" aria-label="Multiply">×</button>

          <!-- Number pad and basic operations -->
          <button class="btn" onClick="numberPressed(7)" aria-label="Seven">7</button>
          <button class="btn" onClick="numberPressed(8)" aria-label="Eight">8</button>
          <button class="btn" onClick="numberPressed(9)" aria-label="Nine">9</button>
          <button class="btn" onClick="operationPressed('-')" aria-label="Subtract">−</button>
          <button class="btn" onClick="parenthesisPressed('(')" aria-label="Left parenthesis">(</button>

          <button class="btn" onClick="numberPressed(4)" aria-label="Four">4</button>
          <button class="btn" onClick="numberPressed(5)" aria-label="Five">5</button>
          <button class="btn" onClick="numberPressed(6)" aria-label="Six">6</button>
          <button class="btn" onClick="operationPressed('+')" aria-label="Add">+</button>
          <button class="btn" onClick="parenthesisPressed(')')" aria-label="Right parenthesis">)</button>

          <button class="btn" onClick="numberPressed(1)" aria-label="One">1</button>
          <button class="btn" onClick="numberPressed(2)" aria-label="Two">2</button>
          <button class="btn" onClick="numberPressed(3)" aria-label="Three">3</button>
          <button class="btn btn-equals span-row-2" onClick="equalPressed()" aria-label="Equals">=</button>

          <button class="btn span-2" onClick="numberPressed(0)" aria-label="Zero">0</button>
          <button class="btn" onClick="decimalPressed()" aria-label="Decimal point">.</button>
        </div>
      </main>
    </div>
  </body>
</html>
