<html lang="en">
  <head>
    <title>Calculator</title>
    <link rel="stylesheet" href="default.css">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="A modern, accessible calculator application">
    <script src="client.js"></script>
  </head>
  <body onLoad="setValue(0)">
    <div class="container" role="main">
      <div id="results">
        <div id="result" role="textbox" aria-live="polite" aria-label="Calculator display">0</div>
      </div>

      <div id="loading" style="visibility:hidden" aria-hidden="true"></div>

      <div class="box">
        <div class="calculator">
          <div class="calculator-buttons" role="grid" aria-label="Calculator buttons">
            <button class="btn span-2" style="visibility: hidden;" aria-hidden="true"></button>
            <button class="btn function" onClick="clearPressed()" aria-label="Clear all">C</button>
            <button class="btn function" onClick="clearPressed()" aria-label="Clear entry">CE</button>

            <button class="btn" onClick="numberPressed(7)" aria-label="Seven">7</button>
            <button class="btn" onClick="numberPressed(8)" aria-label="Eight">8</button>
            <button class="btn" onClick="numberPressed(9)" aria-label="Nine">9</button>
            <button class="btn operator" onClick="operationPressed('/')" aria-label="Divide">&divide;</button>

            <button class="btn" onClick="numberPressed(4)" aria-label="Four">4</button>
            <button class="btn" onClick="numberPressed(5)" aria-label="Five">5</button>
            <button class="btn" onClick="numberPressed(6)" aria-label="Six">6</button>
            <button class="btn operator" onClick="operationPressed('*')" aria-label="Multiply">×</button>

            <button class="btn" onClick="numberPressed(1)" aria-label="One">1</button>
            <button class="btn" onClick="numberPressed(2)" aria-label="Two">2</button>
            <button class="btn" onClick="numberPressed(3)" aria-label="Three">3</button>
            <button class="btn operator" onClick="operationPressed('-')" aria-label="Subtract">−</button>

            <button class="btn" onClick="numberPressed(0)" aria-label="Zero">0</button>
            <button class="btn" onClick="decimalPressed()" aria-label="Decimal point">.</button>
            <button class="btn operator" onClick="operationPressed('+')" aria-label="Add">+</button>
            <button class="btn equals" onClick="equalPressed()" aria-label="Equals">=</button>

            <!-- TODO: Buttons -->
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
